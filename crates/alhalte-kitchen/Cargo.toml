[package]
name = "alhalte-kitchen"
version = "0.1.0"
edition = "2024"
description = "Room log archive processor, graph builder, and EPUB/HTML5 transpiler for Alhalte"
repository = "https://github.com/kinoko0518/Alhalte"

[dependencies]
tin = { path = "../tin-rs" }
generast = { path = "../generast-rs" }
alhalte-saignant = { path = "../alhalte-saignant" }
alhalte-banquette = { path = "../alhalte-banquette" }
serde = { version = "1.0", features = ["derive", "alloc"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
uuid = { version = "1.11", features = ["v4"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
