[package]
name = "tin"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm-siv = "0.11"
blake3 = "1.5"
brotli = "7.0"
half = { version = "2.4", features = ["serde"] }
lz4_flex = "0.11"
postcard = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", features = ["derive", "alloc"] }
thiserror = "2.0"
xxhash-rust = { version = "0.8", features = ["xxh64", "const_xxh64"] }
zstd = "0.13"
