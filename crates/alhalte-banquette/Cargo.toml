[package]
name = "alhalte-banquette"
version = "0.1.0"
edition = "2024"
description = "Room process managing scenes, logs, and state relay for Alhalte"
repository = "https://github.com/kinoko0518/Alhalte"

[dependencies]
tin = { path = "../tin-rs" }
alhalte-cellar = { path = "../alhalte-cellar" }
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive", "alloc"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh64", "const_xxh64"] }
bytes = "1.10"
hex = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
