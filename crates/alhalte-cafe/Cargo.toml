[package]
name = "alhalte-cafe"
version = "0.1.0"
edition = "2024"
description = "One-shot local Alhalte launcher for Linux, macOS, and Windows"
repository = "https://github.com/kinoko0518/Alhalte"

[dependencies]
alhalte-restaurant = { path = "../alhalte-restaurant" }
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
