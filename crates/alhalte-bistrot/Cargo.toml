[package]
name = "alhalte-bistrot"
version = "0.1.0"
edition = "2024"
description = "Restaurant.toml to systemd unit generator for Alhalte"
repository = "https://github.com/kinoko0518/Alhalte"

[dependencies]
alhalte-restaurant = { path = "../alhalte-restaurant" }
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
age = { version = "0.11", features = ["armor"] }
tempfile = "3"
