# ローカル開発用の既定構成（nix run .#bistrot が使う）。
#
# 秘密値（maitre-d.client-secret / cellar.service-token）はここでは平文。
# Bistrot は平文 secret を fail-closed で拒否するため、この設定で動かすには
# `ALHALTE_ALLOW_PLAINTEXT_SECRETS=1` が必要（flake.nix の bistrot-runner が
# ローカル開発時だけ設定する）。
#
# 本番・実 OAuth 資格情報は age armor で暗号化した値を Bistrot.local.toml
# （gitignore 済み）に置く。手順は Bistrot.example.toml を参照。
#   printf '%s' 'SECRET' | alhalte-bistrot encrypt-value --recipient age1...

[restaurant]
domain = "localhost"
host = "127.0.0.1"
data-dir = ".alhalte/data"
socket-dir = ".alhalte/sockets"

[maitre-d]
port = 8080
client-id = "alhalte-local-client"
# ローカル開発専用の平文 secret。本番は age armor にする。
client-secret = "alhalte-local-secret"
salt = "alhalte-local-instance-salt-0001"

[cellar]
port = 8081
anti-oracle = false
# maitre-d の session 検証エンドポイント。未指定なら
# http://<restaurant.host>:<maitre-d.port>（0.0.0.0 / :: は 127.0.0.1）を使う。
# maitre-d-url = "http://127.0.0.1:8080"
# maitre-d-socket = ".alhalte/sockets/maitre-d.sock"
# ローカル開発専用。true にするとすべての session を許可する（既定 false）。
allow-all-sessions = false
# 内部書き込み用のサービス間トークン（age armor で暗号化する秘密値）。
# maitre-d / banquette / cellar が同じ値を使う。未設定の場合、banquette の
# 部屋状態 persistence は cellar に拒否される（本番では必ず設定する）。
# 下記はローカル開発専用の既定値。本番では
# `alhalte-bistrot encrypt-value` で作った armored 値に必ず差し替えること。
service-token = "alhalte-local-service-token"

[banquette]
chunk-size-exponent = 8

[argenterie]
port = 5173

[[extensions]]
id = "alhalte-dsl"
name = "Alhalte DSL"
path = "target/wasm32-unknown-unknown/release/alhalte_dsl.wasm"
enabled = true

[[extensions]]
id = "markdown"
name = "Markdown スタイル"
path = "target/wasm32-unknown-unknown/release/markdown.wasm"
enabled = true

[[extensions]]
id = "aozora"
name = "青空文庫ルビ・傍点"
path = "target/wasm32-unknown-unknown/release/aozora.wasm"
enabled = true

[[extensions]]
id = "coc-6"
name = "クトゥルフ神話TRPG (第6版)"
path = "target/wasm32-unknown-unknown/release/coc_6.wasm"
enabled = false

[[extensions]]
id = "coc-7"
name = "新クトゥルフ神話TRPG (第7版)"
path = "target/wasm32-unknown-unknown/release/coc_7.wasm"
enabled = false

[[extensions]]
id = "emoklore"
name = "エモクロアTRPG"
path = "target/wasm32-unknown-unknown/release/emoklore.wasm"
enabled = false
