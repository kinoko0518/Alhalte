# ローカル開発用の既定構成（nix run .#bistrot が使う）。
#
# 秘密値（maitre-d.client-secret / cellar.service-token）はここでは平文。
# Bistrot は平文 secret を fail-closed で拒否するため、この設定で動かすには
# `ALHALTE_ALLOW_PLAINTEXT_SECRETS=1` が必要（flake.nix の bistrot-runner が
# ローカル開発時だけ設定する）。
#
# 本番・実 OAuth 資格情報は age armor で暗号化した値を Bistrot.local.toml
# （gitignore 済み）に置く。手順は Bistrot.example.toml を参照。
#   printf '%s' 'SECRET' | alhalte-bistrot encrypt-value --recipient age1...

[restaurant]
domain = "100.117.28.78"
host = "127.0.0.1"
data-dir = ".alhalte/data"
socket-dir = ".alhalte/sockets"

[maitre-d]
port = 8080
# debug-login では Google OAuth を使わないが、MaitreDConfig は
# client-id / client-secret を必須フィールドとして要求する。
# Google ログインを使う場合は Bistrot.local.toml（実資格情報）で起動する。
client-id = "debug-client-id"
client-secret = "debug-client-secret"
salt = "alhalte-local-instance-salt-0001"
debug-login = true
public-url = "http://100.117.28.78:5173"

[cellar]
port = 8081
anti-oracle = false
allow-all-sessions = false
service-token = "alhalte-local-service-token"

[banquette]
chunk-size-exponent = 8

[argenterie]
port = 5173
# 開発専用（Issue #229）: 同一イーサネット / LAN 内の端末（スマホ等）から
# Bistrot を開いて状態同期を試せるようにする。
#
# true にすると次の 2 点だけが変わる:
#   - Vite が 0.0.0.0 で待ち受ける（ローカルの http://127.0.0.1:5173/ も従来どおり）
#   - maitre-d に --allow-lan-origin-port 5173 が渡され、
#     http://<プライベート IPv4>:5173 の origin だけが CORS / OAuth の
#     return_to に追加で許可される（ワイルドカードではない）
#
# UI は TLS なしの HTTP で配信され、認証は maitre-d のログインだけに依存する。
# インターネットに露出する環境では絶対に true にしないこと。
# 本番用の Bistrot.local.toml ではこの行を書かない（Rust 側の既定は false）。
lan = true

[[extensions]]
id = "alhalte-dsl"
name = "Alhalte DSL"
path = "target/wasm32-unknown-unknown/release/alhalte_dsl.wasm"
enabled = true

[[extensions]]
id = "markdown"
name = "Markdown スタイル"
path = "target/wasm32-unknown-unknown/release/markdown.wasm"
enabled = true

[[extensions]]
id = "aozora"
name = "青空文庫ルビ・傍点"
path = "target/wasm32-unknown-unknown/release/aozora.wasm"
enabled = true

[[extensions]]
id = "coc-6"
name = "クトゥルフ神話TRPG (第6版)"
path = "target/wasm32-unknown-unknown/release/coc_6.wasm"
enabled = false

[[extensions]]
id = "coc-7"
name = "新クトゥルフ神話TRPG (第7版)"
path = "target/wasm32-unknown-unknown/release/coc_7.wasm"
enabled = false

[[extensions]]
id = "emoklore"
name = "エモクロアTRPG"
path = "target/wasm32-unknown-unknown/release/emoklore.wasm"
enabled = false
