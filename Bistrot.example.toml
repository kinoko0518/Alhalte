# Bistrot.example.toml — Alhalte 構成ファイルのテンプレート（プレースホルダ）
#
# このファイルはそのままでは起動できない。秘密値がプレースホルダのままで、
# Bistrot は復号に失敗する（fail-closed）。実際に使うときは次の手順で
# gitignore 済みの `Bistrot.local.toml` を作る:
#
#   1. cp Bistrot.example.toml Bistrot.local.toml
#   2. age の鍵を作る（既存の鍵があれば不要）
#        age-keygen -o .alhalte/age-identity.txt      # 公開鍵 age1... が表示される
#   3. 秘密値を armored 形式に変換する（標準入力の平文を暗号化する）
#        printf '%s' 'GOOGLE_CLIENT_SECRET' \
#          | alhalte-bistrot encrypt-value --recipient age1...
#        printf '%s' 'INTERNAL_SERVICE_TOKEN' \
#          | alhalte-bistrot encrypt-value --recipient age1...
#   4. 出力（-----BEGIN AGE ENCRYPTED FILE----- 〜 -----END ...-----）を
#      下の `client-secret` / `service-token` の複数行文字列にそのまま貼る。
#   5. 起動時に identity を渡す
#        nix run .#bistrot -- --config Bistrot.local.toml
#        # identity は --age-key / ROPS_AGE / ALHALTE_AGE_KEY の順で解決される
#        export ROPS_AGE="$(cat .alhalte/age-identity.txt)"
#
# 秘密値を平文のまま置きたいのはローカル開発だけ。その場合も
# `ALHALTE_ALLOW_PLAINTEXT_SECRETS=1` を明示したときだけ受理される。
#
# age armor の値は次の形をしている（1 行目と最終行は固定）:
#   service-token = """
#   -----BEGIN AGE ENCRYPTED FILE-----
#   <base64 の暗号文>
#   -----END AGE ENCRYPTED FILE-----
#   """

[restaurant]
domain = "vtt.example.com"
host = "127.0.0.1"
data-dir = "/var/lib/alhalte"
socket-dir = "/run/alhalte"

[maitre-d]
port = 8080
# Google OAuth のクライアント ID（秘密ではない）。
client-id = "REPLACE_WITH_GOOGLE_CLIENT_ID"
# Google OAuth のクライアントシークレット。age armor で暗号化する。
client-secret = """
-----BEGIN AGE ENCRYPTED FILE-----
<alhalte-bistrot encrypt-value --recipient age1... の出力をここに貼る>
-----END AGE ENCRYPTED FILE-----
"""
# Google アカウント sub を暗号化するためのインスタンス固有 salt。
# 秘密値と同じ強度で扱い、インスタンスごとに変える。
salt = "REPLACE_WITH_RANDOM_INSTANCE_SALT"
# public-url は OAuth の redirect_uri の基点。省略時は restaurant.domain から導出。
# public-url = "https://vtt.example.com"
# 開発専用: アカウント名だけでサインインできるデバッグログインを有効にする。
# 有効時は別 DB（<data-dir>/maitre-d-debug.sqlite3）が使われ、banquette は
# cellar へ永続化しない。公開インスタンスでは絶対に有効にしない（Issue #150）。
# debug-login = false

[cellar]
port = 8081
anti-oracle = false
# maitre-d の session 検証エンドポイント。省略時は
# http://<restaurant.host>:<maitre-d.port>（0.0.0.0 / :: は 127.0.0.1）。
# maitre-d-url = "http://127.0.0.1:8080"
# maitre-d-socket = "/run/alhalte/maitre-d.sock"   # 指定時は url より優先
# ローカル開発専用。true にするとすべての session を許可する（既定 false）。
allow-all-sessions = false
# maitre-d / banquette / cellar が共有する内部書き込み用トークン。
# age armor で暗号化する（未設定なら banquette の部屋状態 persistence は拒否される）。
service-token = """
-----BEGIN AGE ENCRYPTED FILE-----
<alhalte-bistrot encrypt-value --recipient age1... の出力をここに貼る>
-----END AGE ENCRYPTED FILE-----
"""

[banquette]
chunk-size-exponent = 8

[argenterie]
port = 5173
# 開発専用（Issue #229）: 同一イーサネット / LAN 内の端末から UI を開けるようにする。
#
# true にすると Vite が 0.0.0.0 で待ち受け、maitre-d が
# http://<プライベート IPv4>:<argenterie.port> の origin を CORS / return_to に
# 追加で許可する（ワイルドカードではない）。UI は TLS なしの HTTP なので、
# 公開ネットワークでは絶対に有効にしない。既定は false（ループバックのみ）。
# lan = false

[[extensions]]
id = "alhalte-dsl"
name = "Alhalte DSL"
path = "target/wasm32-unknown-unknown/release/alhalte_dsl.wasm"
enabled = true

[[extensions]]
id = "markdown"
name = "Markdown スタイル"
path = "target/wasm32-unknown-unknown/release/markdown.wasm"
enabled = true

[[extensions]]
id = "aozora"
name = "青空文庫ルビ・傍点"
path = "target/wasm32-unknown-unknown/release/aozora.wasm"
enabled = true

[[extensions]]
id = "coc-6"
name = "クトゥルフ神話TRPG (第6版)"
path = "target/wasm32-unknown-unknown/release/coc_6.wasm"
enabled = false

[[extensions]]
id = "coc-7"
name = "新クトゥルフ神話TRPG (第7版)"
path = "target/wasm32-unknown-unknown/release/coc_7.wasm"
enabled = false

[[extensions]]
id = "emoklore"
name = "エモクロアTRPG"
path = "target/wasm32-unknown-unknown/release/emoklore.wasm"
enabled = false
